# Render dağıtımı (blueprint) — opsiyonel kolaylık
# Alternatif: Render dashboard'undan "New Web Service" ile de ekleyebilirsin.
services:
  - type: web
    name: kaosbot
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: GROQ_API_KEY
        sync: false